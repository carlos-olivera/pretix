[pretix]
instance_name=pretix Development
url=http://localhost:8000
registration=on
datadir=/pretix/src/data

[database]
backend=postgresql
name=pretix
user=pretix
password=pretix
host=db
port=5432

[redis]
location=redis://redis:6379/0
sessions=on

[celery]
broker=redis://redis:6379/1
backend=redis://redis:6379/2

[mail]
from=pretix@localhost
host=localhost
port=1025

[django]
debug=true
secret=development-secret-key-not-for-production
